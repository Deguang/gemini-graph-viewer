<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gemini Polish Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="../icon.png" alt="Logo" class="logo">
    <div class="title">Gemini Polish</div>
    <div class="version" id="version"></div>
  </header>

  <main class="container">
    <!-- Default view: pick a recipe, nudge the two or three values people
         actually reach for. Everything else lives under Advanced. -->
    <section class="card">
      <!-- Both rows share the grid so their labels share one column, sized to
           the widest — a fixed width fits 风格/配色 but clips "Couleurs". -->
      <div class="pick-grid">
        <div class="pick-row">
          <label for="preset" data-i18n="label_preset">Style</label>
          <select id="preset"></select>
        </div>
        <div class="pick-row">
          <label for="colorScheme" data-i18n="label_scheme">Colours</label>
          <select id="colorScheme"></select>
        </div>
      </div>
      <!-- Which palette is live is Gemini's call, not ours: the popup edits
           whichever one the page is showing and says which that is. -->
      <div class="palette-row">
        <div class="palette-mode" id="paletteMode"></div>
        <div class="palette-strip" id="paletteStrip" aria-hidden="true"></div>
      </div>

      <div id="quickSliders"></div>
      <div id="quickSwitches"></div>
    </section>

    <details class="card group" id="advancedGroup">
      <summary data-i18n="advanced">Advanced</summary>
      <div class="group-body">
        <div id="advanced"></div>

        <div class="section-hint" data-i18n="section_escape">Escape hatch</div>
        <textarea id="customCSS" placeholder="/* .your-rule { color: red !important; } */" spellcheck="false"></textarea>
        <div class="hint" data-i18n="custom_css_hint">Engine rules carry !important, so custom CSS needs it too in order to win.</div>
        <button id="resetPreset" class="reset-btn" data-i18n="reset_btn">Reset to current style</button>
      </div>
    </details>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script src="../shared/config.js"></script>
  <script src="../shared/css-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
