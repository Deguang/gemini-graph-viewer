<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Toolbar icons render at 16px. The previous version put five code bars, three
    flowchart nodes, two arrowheads and a dashed divider on a near-black ground
    (#0d0c1a) — at 16px every one of those is sub-pixel, so it resolved to a dark
    smudge. This keeps the identity (split view: source on the left, diagram on
    the right) but at a mark count that survives the smallest size: six shapes,
    all chunky, white on a bright ground.
  -->
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#6b5bff"/>
    <!-- Left pane a shade deeper so the split still reads once the marks blur -->
    <rect width="248" height="512" fill="#5546e8"/>
    <rect x="248" width="10" height="512" fill="#ffffff" opacity=".5"/>

    <!-- source lines -->
    <rect x="58" y="192" width="134" height="48" rx="24" fill="#ffffff"/>
    <rect x="58" y="268" width="98"  height="48" rx="24" fill="#ffffff" opacity=".7"/>

    <!-- diagram nodes + connector -->
    <rect x="374" y="236" width="18" height="60" fill="#ffffff" opacity=".85"/>
    <rect x="310" y="170" width="146" height="66" rx="22" fill="#ffffff"/>
    <rect x="310" y="296" width="146" height="66" rx="22" fill="#ffffff"/>
  </g>
</svg>
